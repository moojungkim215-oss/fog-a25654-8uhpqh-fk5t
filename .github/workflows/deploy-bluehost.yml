# GitHub에 올라온 홈페이지를 Bluehost(firstonegroup.org)로 자동 전송
# 필요한 비밀 설정(Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# 서버에 원래 있던 파일(WordPress 등)은 지우지 않고, 이 저장소의 파일만 올리고 바꿉니다.
name: Bluehost 자동 업로드

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bluehost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: 비밀 설정 확인
        if: env.FTP_SERVER == ''
        run: echo "FTP 비밀 설정이 아직 없어서 업로드를 건너뜁니다."
      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''
      - name: Bluehost로 업로드
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            archive/**
            README.md
